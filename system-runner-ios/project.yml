name: GekkoRunner
options:
  bundleIdPrefix: com.jakala.gekko
  deploymentTarget:
    iOS: "15.0"
    tvOS: "15.0"
targets:
  GekkoRunnerHost:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jakala.gekko.runnerhost
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
  GekkoRunnerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: GekkoRunnerHost
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jakala.gekko.runneruitests
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: GekkoRunnerHost
      GEKKO_VERSION: unknown
      INFOPLIST_FILE: Info/RunnerTests.plist
  # The same runner for the Apple TV simulator: it presses the buttons of the remote instead of touching the screen
  GekkoRunnerHostTV:
    type: application
    platform: tvOS
    sources: [Host]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jakala.gekko.runnerhost
      GENERATE_INFOPLIST_FILE: YES
  GekkoRunnerUITestsTV:
    type: bundle.ui-testing
    platform: tvOS
    sources: [Tests]
    dependencies:
      - target: GekkoRunnerHostTV
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jakala.gekko.runneruitests
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: GekkoRunnerHostTV
      GEKKO_VERSION: unknown
      INFOPLIST_FILE: Info/RunnerTests.plist
schemes:
  GekkoRunnerTV:
    build:
      targets:
        GekkoRunnerHostTV: all
        GekkoRunnerUITestsTV: [test]
    test:
      targets: [GekkoRunnerUITestsTV]
  GekkoRunner:
    build:
      targets:
        GekkoRunnerHost: all
        GekkoRunnerUITests: [test]
    test:
      targets: [GekkoRunnerUITests]
