version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 10
  - package-ecosystem: 'gradle'
    directory: '/'
    schedule:
      interval: 'weekly'
  - package-ecosystem: 'gradle'
    directory: '/gradle-plugin'
    schedule:
      interval: 'weekly'
  - package-ecosystem: 'gradle'
    directory: '/build-logic'
    schedule:
      interval: 'weekly'
  - package-ecosystem: 'swift'
    directory: '/'
    schedule:
      interval: 'weekly'
