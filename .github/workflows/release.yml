name: 'Release'
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version of a dry run: everything is built and tested, nothing is published'
        required: true
        default: '0.0.0-dryrun'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'

jobs:
  checks:
    name: 'Checks'
    uses: ./.github/workflows/ci.yml

  guard:
    name: 'Guard'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 'The tag is a version on main and has a changelog section'
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            git fetch origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$VERSION is not on main; release only from main" >&2
              exit 1
            fi
            if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no section for $VERSION" >&2
              exit 1
            fi
          fi
        shell: bash

  build-linux:
    name: 'Build Linux and Android'
    needs: [ guard ]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Set up JDK'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 'Build the Linux binary and the Android system runner'
        run: |
          ./gradlew -PVERSION_NAME="$VERSION" :cli:linkReleaseExecutableLinuxX64 :system-runner-android:assembleDebug
          mkdir -p release-assets
          cp cli/build/bin/linuxX64/releaseExecutable/gekko.kexe release-assets/gekko-linux-x64
          cp system-runner-android/build/outputs/apk/debug/system-runner-android-debug.apk release-assets/gekko-system-runner.apk
        shell: bash

      - name: 'Upload the assets'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-linux
          path: release-assets
          if-no-files-found: error

  build-macos:
    name: 'Build macOS and iOS'
    needs: [ guard ]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Set up JDK'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 'Build the macOS binary'
        run: |
          ./gradlew -PVERSION_NAME="$VERSION" :cli:linkReleaseExecutableMacosArm64
          mkdir -p release-assets
          cp cli/build/bin/macosArm64/releaseExecutable/gekko.kexe release-assets/gekko-macos-arm64
        shell: bash

      - name: 'Build the iOS system runner and agent'
        run: |
          brew install xcodegen
          VERSION_NAME="$VERSION" ./scripts/build-ios-runner.sh
          cp dist/gekko-ios-runner.zip dist/gekko-ios-agent.zip release-assets/
        shell: bash

      - name: 'Upload the assets'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-macos
          path: release-assets
          if-no-files-found: error

  publish:
    name: 'Publish'
    if: ${{ github.event_name == 'push' }}
    needs: [ checks, guard, build-linux, build-macos ]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Required reviewers and the tag rule of this environment are the gate for everything that cannot be undone
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign the build provenance
      attestations: write
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Set up JDK'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 'Download the assets'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: assets-*
          path: release-assets
          merge-multiple: true

      - name: 'Create the checksums'
        run: |
          cd release-assets
          shasum -a 256 gekko-* > SHA256SUMS
          cat SHA256SUMS
        shell: bash

      - name: 'Attest the build provenance'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: 'release-assets/gekko-*'

      - name: 'Extract the release notes'
        uses: ffurrer2/extract-release-notes@cae32133495112d23e3569ad04fef240ba4e7bc8 # v2.3.0
        with:
          release_notes_file: RELEASE_NOTES.md

      - name: 'List the checksums in the release notes'
        run: |
          {
          cat <<'EOF'

          ## SHA-256

          Verify a download with `gh attestation verify <file> --repo jakala-germany/gekko`; the hashes are also in the SHA256SUMS asset.

          ```
          EOF
          cat release-assets/SHA256SUMS
          printf '%s\n' '```'
          } >> RELEASE_NOTES.md
        shell: bash

      # The GitHub release first, as a draft: it can be fixed or deleted. Maven Central cannot.
      - name: 'Create the draft GitHub release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" release-assets/* --clobber
          else
            gh release create "$VERSION" release-assets/* --draft --title "$VERSION" --notes-file RELEASE_NOTES.md
          fi
        shell: bash

      - name: 'Publish to Maven Central'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SECRET_PASSPHRASE }}
        run: |
          ./gradlew -PVERSION_NAME="$VERSION" :protocol:publishToMavenCentral :transport-jvm:publishToMavenCentral :agent-android:publishToMavenCentral
          (cd gradle-plugin && ../gradlew -PVERSION_NAME="$VERSION" publishToMavenCentral)
        shell: bash

      - name: 'Publish the GitHub release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$VERSION" --draft=false --latest
        shell: bash
