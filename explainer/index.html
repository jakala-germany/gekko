<!doctype html>
<meta charset="utf-8">
<title>explainer</title>
<style>
  @font-face { font-family: 'Patrick Hand'; src: url(fonts/PatrickHand-Regular.ttf); }
  html, body { margin: 0; background: #fff; }
  canvas { display: block; }
  body.preview { background: #222; display: flex; flex-direction: column; align-items: center; height: 100vh; color: #fff; font: 14px sans-serif; }
  body.preview canvas { max-width: 100vw; max-height: calc(100vh - 50px); width: auto; height: auto; aspect-ratio: 16/9; background: #fff; }
  #bar { display: none; padding: 12px; gap: 12px; align-items: center; }
  body.preview #bar { display: flex; }
  #scrub { width: 70vw; }
</style>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="bar"><button id="play">play</button><input id="scrub" type="range" min="0" max="1" step="0.01" value="0"><span id="tt">0.0</span></div>
<script type="module" src="src/main.js"></script>
