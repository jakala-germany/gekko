name: The system runner flings on a short swipe and not on a long one
tags: [touches, exactness]
# The same as "A short swipe flings the list on and a long one does not", with a real touch of the system runner
steps:
  - say: A slow swipe of 10 percent of the screen, 1000 ms
    platform: [android, ios]
    do: { swipe: { start: "11%,90%", end: "11%,80%", durationMs: 1000, system: true } }
  - platform: [android, ios]
    do: { wait: 1000 }
  - say: Read how far the list is scrolled
    platform: [android, ios]
    do: { copyText: { from: { id: sample.list.offset }, match: "\\d+", as: runnerSlow } }
  - say: A fast swipe of the same length, 100 ms
    platform: [android, ios]
    do: { swipe: { start: "11%,90%", end: "11%,80%", durationMs: 100, system: true } }
  - platform: [android, ios]
    do: { wait: 4000 }
  - say: Read how far the list is scrolled now
    platform: [android, ios]
    do: { copyText: { from: { id: sample.list.offset }, match: "\\d+", as: runnerFast } }
