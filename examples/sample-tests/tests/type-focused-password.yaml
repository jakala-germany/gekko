name: Typing at the focus into a password field
tags: [typing]
steps:
  - say: Put the focus into the password field by tapping it
    do: { tap: { id: sample.password } }
  - say: Type the first part at the cursor
    do: { typeFocused: { value: s3cret } }
  - say: Type the rest after it
    do: { typeFocused: { value: "!!" } }
  - say: The app counts what was typed, the field never gives it away
    do: { assertVisible: { id: sample.password.length, text: "Password: 8" } }
