name: The system runner drags the list like a finger
tags: [touches, list]
steps:
  - say: The first row is on screen
    platform: [android, ios]
    do: { assertVisible: { id: sample.row.1 } }
  - say: Drag the list up by 60 percent of the screen with a real touch
    platform: [android, ios]
    do: { drag: { start: "11%,90%", end: "11%,30%", system: true } }
  - say: The first row has scrolled away
    platform: [android, ios]
    do: { assertNotVisible: { id: sample.row.1 } }
  - say: A row further down is on screen, the list did not fling to its end
    platform: [android, ios]
    do: { assertVisible: { id: sample.row.35 } }
  - say: A swipe with a long duration moves the list on without flinging it
    platform: [android, ios]
    do: { swipe: { start: "11%,70%", end: "11%,65%", durationMs: 1500, system: true } }
  - say: The row is still on screen
    platform: [android, ios]
    do: { assertVisible: { id: sample.row.35 } }
