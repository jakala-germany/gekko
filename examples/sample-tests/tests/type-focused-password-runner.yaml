name: The system runner types into a password field
# The Android runner reads a password field as bullets and refuses (checked by scripts/e2e-android.sh)
tags: [typing]
steps:
  - say: Put the focus into the password field with a real touch
    platform: ios
    do: { tap: { id: sample.password, system: true } }
  - say: Type the first part at the cursor
    platform: ios
    do: { typeFocused: { value: s3cret, system: true } }
  - say: Type the rest after it
    platform: ios
    do: { typeFocused: { value: "!!", system: true } }
  - say: The app counts what was typed
    platform: ios
    do: { assertVisible: { id: sample.password.length, text: "Password: 8" } }
