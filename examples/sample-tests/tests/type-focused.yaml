name: Typing at the focus adds to the text
tags: [typing]
steps:
  - say: Put the focus into the name field by tapping it
    do: { tap: { id: sample.name } }
  - say: Type the first name at the cursor
    do: { typeFocused: { value: Ada } }
  - say: Type the last name after it, without naming the field
    do: { typeFocused: { value: " Lovelace" } }
  - say: The field holds both names
    do: { assertVisible: { id: sample.name, text: "Ada Lovelace" } }
  - say: Greet
    do: { tap: { id: sample.greet } }
  - say: The greeting has both names
    do: { assertVisible: { id: sample.greeting, text: "Hello Ada Lovelace" } }
