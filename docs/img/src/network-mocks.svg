<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 640" width="1760" height="640">
<defs>
  <style>
    .ink   { fill:none; stroke:#111; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round }
    .paper { fill:#fff; stroke:#111; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round }
    .solid { fill:#111; stroke:#111; stroke-width:3; stroke-linejoin:round }
    .flow  { fill:none; stroke:#F28C1E; stroke-width:4.5; stroke-linecap:round; stroke-linejoin:round }
    .dot-r { fill:#E5322D; stroke:#E5322D; stroke-width:2; stroke-linejoin:round }
    .dot-o { fill:#F28C1E; stroke:#F28C1E; stroke-width:2; stroke-linejoin:round }
    .dot-b { fill:#2F6FE4; stroke:#2F6FE4; stroke-width:2; stroke-linejoin:round }
    .sys   { fill:none; stroke:#2F6FE4; stroke-width:4.5; stroke-linecap:round; stroke-linejoin:round }
    .warn  { fill:none; stroke:#E5322D; stroke-width:4; stroke-linecap:round; stroke-linejoin:round }
    .note  { fill:none; stroke:#2F6FE4; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:14 11 }
    .t     { font-family:'Patrick Hand','Bradley Hand','Marker Felt','Chalkboard SE',cursive; font-size:46px; fill:#111 }
    .t-r   { fill:#E5322D }
    .t-o   { fill:#F28C1E }
    .t-b   { fill:#2F6FE4 }
    .t-s   { font-size:36px }
    .t-l   { font-size:58px }
    .mid   { text-anchor:middle }
