<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 640" width="1760" height="640">
<defs>
  <style>
    .ink   { fill:none; stroke:#111; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round }
