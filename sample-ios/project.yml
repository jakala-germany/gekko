name: Sample
options:
  bundleIdPrefix: com.jakala.gekko
  deploymentTarget:
    iOS: "15.0"
# The sample app for physical devices: a signed debug build that links the GekkoAgent package, because a device build
# cannot get the agent injected the way a simulator build does. scripts/build-sample-ios-device.sh generates and builds it.
packages:
  Gekko:
    path: ..
targets:
  Sample:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: Gekko
        product: GekkoAgent
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jakala.gekko.sample
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Sample
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
